<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중3 수학 탐구 월드</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
@font-face{
  font-family:'DungGeunMo';
  src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/DungGeunMo.woff') format('woff');
  font-weight:normal; font-style:normal; font-display:swap;
}
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --font: 'DungGeunMo','Galmuri11',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --sky-top:#4aa3e8; --sky-bot:#8fd0f5;
  --wood:#8a5a2b; --wood-lt:#b0793f; --wood-dk:#5c3a19;
  --stone:#7a7a7a; --stone-lt:#a0a0a0; --stone-dk:#4d4d4d;
  --grass:#5fbb46; --grass-dk:#3f8f2c;
  --panel:#1d1d1dcc;
  --gold:#ffd83d;
}
html,body{height:100%}
body{
  font-family:var(--font);
  background:linear-gradient(180deg,#2f8fd8 0%,#57a9e6 42%,#8ccdf3 78%,#b9e2fa 100%);
  color:#fff; overflow-x:hidden;
  image-rendering:pixelated;
  -webkit-font-smoothing:none;
}

/* ============ 배경 월드 ============ */
#world{
  position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
}
#world::after{ /* 아래쪽 은은한 안개 */
  content:''; position:absolute; left:0; right:0; bottom:0; height:38vh;
  background:linear-gradient(180deg,rgba(185,226,250,0) 0%,rgba(185,226,250,.55) 70%,rgba(185,226,250,.85) 100%);
}
.cloud{
  position:absolute; opacity:.9;
  background:#fff; box-shadow:
    16px 0 0 #fff, 32px 0 0 #fff, 48px 0 0 #fff,
    16px -16px 0 #fff, 32px -16px 0 #fff,
    32px -32px 0 #fff, 8px 16px 0 #fff, 40px 16px 0 #fff;
  width:16px;height:16px;
  animation:drift linear infinite;
}
@keyframes drift{
  from{transform:translateX(-25vw)}
  to{transform:translateX(125vw)}
}
.scene{ position:absolute; perspective:1100px; will-change:transform; }
.bob{ animation:bob ease-in-out infinite alternate; transform-style:preserve-3d; }
@keyframes bob{
  from{transform:translateY(-14px)}
  to{transform:translateY(14px)}
}
.tilt{ transform-style:preserve-3d; }
.spin{ transform-style:preserve-3d; animation:spinY linear infinite; }
@keyframes spinY{
  from{transform:rotateY(0deg)}
  to{transform:rotateY(360deg)}
}
.face{
  position:absolute; left:50%; top:50%;
  background-repeat:repeat; background-size:100% 100%;
  image-rendering:pixelated;
  backface-visibility:hidden;
}

/* ============ 헤더 / 목차 ============ */
header{
  position:fixed; top:0; left:0; right:0; z-index:120;
  background:#6b4423;
  border-bottom:4px solid #3d2612;
  box-shadow:0 4px 0 #00000033;
}
.bar{
  max-width:1180px; margin:0 auto; padding:0 12px;
  display:flex; align-items:center; gap:10px; height:60px;
}
.brand{
  display:flex; align-items:center; gap:8px; flex-shrink:0;
  font-size:19px; letter-spacing:1px; text-shadow:2px 2px 0 #00000088;
}
.brand .cube{
  width:26px;height:26px; flex-shrink:0;
  border:2px solid #2c1a0b;
  background:#5fbb46;
  box-shadow:inset 0 -9px 0 #7a4a22, inset 0 -11px 0 #3f8f2c;
}
nav{margin-left:auto; display:flex; gap:4px; align-items:center}
.mbtn{
  font-family:var(--font); font-size:15px; color:#ffe9c9;
  background:#8a5a2b; border:none; cursor:pointer;
  padding:9px 12px; letter-spacing:.5px; position:relative;
  box-shadow: inset 2px 2px 0 #b0793f, inset -2px -2px 0 #5c3a19;
  transition:background .08s;
}
.mbtn:hover{background:#a06a34; color:#fff}
.mbtn[aria-expanded="true"]{
  background:#4f3117; color:var(--gold);
  box-shadow: inset 2px 2px 0 #3a2410, inset -2px -2px 0 #6b4423;
}
.mbtn .num{color:var(--gold); margin-right:4px}
.mbtn .dot{
  display:inline-block; width:6px;height:6px; margin-left:6px;
  vertical-align:middle; background:#ffd83d;
}
.mbtn.empty .dot{background:#8d8d8d}

.menuwrap{position:relative}
.panel{
  position:absolute; top:calc(100% + 10px); left:50%; transform:translateX(-50%) translateY(-6px);
  min-width:260px; background:#c9a86a;
  border:4px solid #3d2612;
  box-shadow:0 6px 0 #00000055, inset 3px 3px 0 #e0c48f, inset -3px -3px 0 #97794a;
  padding:8px; opacity:0; visibility:hidden;
  transition:opacity .12s ease, transform .12s ease, visibility .12s;
  z-index:130;
}
.panel.open{opacity:1; visibility:visible; transform:translateX(-50%) translateY(0)}
.panel::before{
  content:''; position:absolute; top:-14px; left:50%; margin-left:-8px;
  width:0;height:0; border:8px solid transparent; border-bottom-color:#3d2612;
}
.ptitle{
  font-size:13px; color:#3d2612; padding:4px 6px 8px;
  border-bottom:3px solid #a9884f; margin-bottom:6px; letter-spacing:.5px;
}
.pitem{
  display:flex; align-items:center; gap:8px;
  padding:9px 10px; font-size:15px; color:#2b1a0a;
  background:#e0c48f; border:2px solid #8a6c3d;
  text-decoration:none; cursor:pointer; margin-bottom:5px;
  box-shadow:inset 2px 2px 0 #f2ddb6, inset -2px -2px 0 #b89a63;
  transition:transform .06s, background .08s;
}
.pitem:last-child{margin-bottom:0}
.pitem:hover{background:#f3e0b8; transform:translateX(3px)}
.pitem .ic{width:14px;height:14px;background:#3f8f2c;border:2px solid #2b1a0a;flex-shrink:0}
.pitem.beta .ic{background:#e0913a}
.pempty{
  padding:14px 10px; font-size:14px; color:#5a4526; text-align:center;
  background:#b89a63; border:2px dashed #6b5330;
}
.tagbeta{margin-left:auto;font-size:11px;color:#8a4a10}

.ham{display:none}

/* ============ 히어로 ============ */
main{position:relative; z-index:10}
.hero{
  min-height:100vh; padding:120px 16px 60px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center;
}
h1{
  font-size:clamp(40px,8vw,92px); line-height:1.15; letter-spacing:4px;
  color:#fff;
  text-shadow:
    4px 4px 0 #1b1b1b, -4px 4px 0 #1b1b1b, 4px -4px 0 #1b1b1b, -4px -4px 0 #1b1b1b,
    0 8px 0 #1b1b1b, 8px 8px 0 #00000044;
}
.sub-en{
  margin-top:10px; font-size:clamp(12px,2vw,17px); letter-spacing:8px; color:#eaf6ff;
  text-shadow:2px 2px 0 #1b1b1bcc;
}
.sub-ko{
  margin-top:16px; font-size:clamp(15px,2.4vw,21px); color:#fff;
  text-shadow:2px 2px 0 #1b1b1bcc;
}
.sub-desc{
  margin-top:8px; font-size:clamp(13px,2vw,17px); color:#e6f3ff; line-height:1.8;
  text-shadow:2px 2px 0 #1b1b1baa; max-width:720px;
}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px}
.chip{
  background:#1d1d1de6; border:3px solid #000; padding:9px 14px; font-size:15px;
  box-shadow:inset 2px 2px 0 #4a4a4a, inset -2px -2px 0 #0a0a0a;
  display:flex;align-items:center;gap:7px;
}
.chip b{color:var(--gold); font-size:19px}
.chip .sq{width:12px;height:12px;border:2px solid #000}
.searchbox{
  margin-top:20px; width:min(560px,92vw);
  background:#1d1d1de6; border:3px solid #000; padding:12px 14px;
  box-shadow:inset 2px 2px 0 #4a4a4a, inset -2px -2px 0 #0a0a0a;
  display:flex;align-items:center;gap:10px;
}
.searchbox input{
  flex:1; background:transparent;border:none;outline:none;
  font-family:var(--font); font-size:16px; color:#fff;
}
.searchbox input::placeholder{color:#9fb4c4}
.scrollhint{margin-top:34px;font-size:14px;color:#fff;text-shadow:2px 2px 0 #000a;animation:bob2 1.2s ease-in-out infinite alternate}
@keyframes bob2{from{transform:translateY(0)}to{transform:translateY(8px)}}

/* ============ 아래 섹션 (그대로 유지용) ============ */
.section{max-width:1180px;margin:0 auto;padding:40px 16px 90px}
.sec-title{
  font-size:26px;text-align:center;margin-bottom:8px;
  text-shadow:3px 3px 0 #1b1b1b;
}
.sec-desc{text-align:center;font-size:14px;color:#eaf6ff;text-shadow:2px 2px 0 #1b1b1baa;margin-bottom:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{
  background:#1d1d1de0;border:4px solid #000;padding:16px;
  box-shadow:inset 3px 3px 0 #4a4a4a, inset -3px -3px 0 #0a0a0a;
  cursor:pointer; transition:transform .1s;
}
.card:hover{transform:translateY(-4px)}
.card h3{font-size:18px;margin-bottom:6px}
.card .cnt{font-size:13px;color:#b9d6ea}
.card .icon{width:34px;height:34px;border:3px solid #000;margin-bottom:10px}
.card ul{margin-top:10px;list-style:none;font-size:13px;color:#dfe9f0;line-height:1.9}
.card li::before{content:'▪ ';color:var(--gold)}
.soon{color:#9d9d9d;font-size:13px;margin-top:10px}
footer{
  position:relative;z-index:10;text-align:center;padding:22px;font-size:13px;
  color:#ffe9c9;background:#3d2612;border-top:4px solid #241407;
}

@media(max-width:1020px){
  .ham{
    display:block;margin-left:auto;background:#8a5a2b;border:none;cursor:pointer;
    color:#ffe9c9;font-family:var(--font);font-size:16px;padding:10px 14px;
    box-shadow: inset 2px 2px 0 #b0793f, inset -2px -2px 0 #5c3a19;
  }
  nav{
    position:fixed; top:60px; left:0; right:0;
    flex-direction:column; align-items:stretch; gap:0;
    background:#6b4423; border-bottom:4px solid #3d2612;
    max-height:0; overflow:hidden; transition:max-height .2s ease;
  }
  nav.open{max-height:80vh; overflow-y:auto}
  .menuwrap{position:static}
  .mbtn{width:100%;text-align:left;border-bottom:2px solid #4f3117}
  .panel{
    position:static; transform:none; min-width:0; margin:0 0 6px;
    opacity:1; visibility:visible; display:none; box-shadow:none; border-width:0 0 4px 0;
  }
  .panel.open{display:block; transform:none}
  .panel::before{display:none}
}
@media (prefers-reduced-motion: reduce){
  .bob,.spin,.cloud,.scrollhint{animation:none !important}
}
</style>
</head>
<body>

<div id="world" aria-hidden="true"></div>

<header>
  <div class="bar">
    <div class="brand"><span class="cube"></span><span>중3 수학 탐구 월드</span></div>
    <button class="ham" id="ham" aria-label="메뉴 열기">☰ 메뉴</button>
    <nav id="nav"></nav>
  </div>
</header>

<main>
  <section class="hero">
    <h1>중3 수학 탐구 월드</h1>
    <div class="sub-en">MATH EXPLORATION WORLD</div>
    <div class="sub-ko">블록을 깨듯 하나씩, 직접 탐험하며 배우는 수학 세계</div>
    <div class="sub-desc">중학교 3학년 수학 단원별 웹앱·게임·시뮬레이션을 한곳에 모아 놓은 공간입니다.<br>위쪽 단원 메뉴를 누르면 세부 목차가 열립니다.</div>

    <div class="chips">
      <div class="chip"><span class="sq" style="background:#5fbb46"></span>단원 <b>6</b> 개</div>
      <div class="chip"><span class="sq" style="background:#4fc3f7"></span>콘텐츠 <b>7</b> 개</div>
      <div class="chip"><span class="sq" style="background:#ffd83d"></span>공개 단원 <b>3</b> 개</div>
    </div>

    <div class="searchbox">
      <span>🔍</span>
      <input id="q" type="text" placeholder="검색: 제곱근, 지렁이, 삼각비...">
    </div>

    <div class="scrollhint">▼ 아래로 스크롤하여 탐험 지역 선택</div>
  </section>

  <section class="section" id="regions">
    <h2 class="sec-title">탐험 지역 선택</h2>
    <p class="sec-desc">단원을 골라 탐험을 시작하세요</p>
    <div class="grid" id="grid"></div>
  </section>
</main>

<footer>중3 수학 탐구 월드 · 블록을 깨듯 하나씩 배우는 수학</footer>

<script>
/* =========================================================
   단원 / 세부 목차 데이터  ── link 값만 채우면 자동 연결됩니다
   ========================================================= */
const UNITS = [
  { no:1, title:'실수와 그 계산', color:'#5fbb46', items:[
      { name:'제곱근 떨어트리기', link:'' }
  ]},
  { no:2, title:'이차방정식', color:'#4fc3f7', items:[] },
  { no:3, title:'이차함수', color:'#ff8a5c', items:[
      { name:'이차함수 지렁이 대모험', link:'' },
      { name:'반응속도 테스트', link:'' },
      { name:'자전거 정지거리 시뮬레이션', link:'' }
  ]},
  { no:4, title:'삼각비', color:'#c792ea', items:[
      { name:'단위원과 삼각비의 원리', link:'' },
      { name:'삼각측량과 GPS 알아보기', link:'' },
      { name:'삼각함수 점프킹', link:'', beta:'버그 많음' }
  ]},
  { no:5, title:'원의 성질', color:'#ffd83d', items:[] },
  { no:6, title:'통계', color:'#ff6b6b', items:[] }
];

/* ---------- 상단 메뉴 만들기 ---------- */
const nav = document.getElementById('nav');
UNITS.forEach((u, i) => {
  const wrap = document.createElement('div');
  wrap.className = 'menuwrap';

  const btn = document.createElement('button');
  btn.className = 'mbtn' + (u.items.length ? '' : ' empty');
  btn.setAttribute('aria-expanded','false');
  btn.setAttribute('aria-haspopup','true');
  btn.innerHTML = '<span class="num">' + u.no + '.</span>' + u.title + '<span class="dot"></span>';

  const panel = document.createElement('div');
  panel.className = 'panel';
  let inner = '<div class="ptitle">' + u.no + '. ' + u.title + '</div>';
  if (u.items.length === 0) {
    inner += '<div class="pempty">준비 중입니다</div>';
  } else {
    u.items.forEach(it => {
      const tag = it.beta ? '<span class="tagbeta">' + it.beta + '</span>' : '';
      const cls = 'pitem' + (it.beta ? ' beta' : '');
      if (it.link) {
        inner += '<a class="' + cls + '" href="' + it.link + '"><span class="ic"></span>' + it.name + tag + '</a>';
      } else {
        inner += '<div class="' + cls + '" data-soon="1"><span class="ic"></span>' + it.name + tag + '</div>';
      }
    });
  }
  panel.innerHTML = inner;

  btn.addEventListener('click', e => {
    e.stopPropagation();
    const isOpen = panel.classList.contains('open');
    closeAll();
    if (!isOpen) {
      panel.classList.add('open');
      btn.setAttribute('aria-expanded','true');
    }
  });
  panel.addEventListener('click', e => e.stopPropagation());

  wrap.appendChild(btn);
  wrap.appendChild(panel);
  nav.appendChild(wrap);
});

function closeAll(){
  document.querySelectorAll('.panel.open').forEach(p => p.classList.remove('open'));
  document.querySelectorAll('.mbtn[aria-expanded="true"]').forEach(b => b.setAttribute('aria-expanded','false'));
}
/* 바깥 클릭 / ESC 로 닫기 */
document.addEventListener('click', closeAll);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });
window.addEventListener('scroll', closeAll, {passive:true});

/* 햄버거 */
const ham = document.getElementById('ham');
ham.addEventListener('click', e => {
  e.stopPropagation();
  nav.classList.toggle('open');
  if (!nav.classList.contains('open')) closeAll();
});

/* ---------- 아래 카드(탐험 지역) ---------- */
const grid = document.getElementById('grid');
UNITS.forEach(u => {
  const c = document.createElement('div');
  c.className = 'card';
  let li = '';
  if (u.items.length) {
    li = '<ul>' + u.items.map(i => '<li>' + i.name + '</li>').join('') + '</ul>';
  } else {
    li = '<div class="soon">🔒 콘텐츠 준비 중</div>';
  }
  c.innerHTML =
    '<div class="icon" style="background:' + u.color + '"></div>' +
    '<h3>' + u.no + '. ' + u.title + '</h3>' +
    '<div class="cnt">콘텐츠 ' + u.items.length + '개</div>' + li;
  grid.appendChild(c);
});

/* ---------- 간단 검색 ---------- */
document.getElementById('q').addEventListener('input', function(){
  const v = this.value.trim();
  if (!v) { document.querySelectorAll('.card').forEach(c => c.style.display=''); return; }
  document.querySelectorAll('.card').forEach(c => {
    c.style.display = c.textContent.includes(v) ? '' : 'none';
  });
});

/* =========================================================
   배경 월드 : 둥실둥실 + 빙글빙글 도는 복셀 블록
   ========================================================= */
(function(){
  const world = document.getElementById('world');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* 16x16 픽셀 노이즈 텍스처 생성 */
  function tex(colors, grassTop){
    const s = 16;
    const cv = document.createElement('canvas');
    cv.width = cv.height = s;
    const g = cv.getContext('2d');
    for (let y=0; y<s; y++){
      for (let x=0; x<s; x++){
        let pal = colors;
        if (grassTop){
          if (y < 3) pal = grassTop.top;
          else if (y === 3) pal = (Math.random() < 0.5 ? grassTop.top : colors);
          else pal = colors;
        }
        g.fillStyle = pal[(Math.random()*pal.length)|0];
        g.fillRect(x,y,1,1);
      }
    }
    return cv.toDataURL();
  }

  const GREEN  = ['#6abe45','#5aa838','#7ccb54','#4e9630'];
  const DIRT   = ['#8a5a2b','#7a4d22','#9a6a35','#6b4019'];
  const STONE  = ['#8b8b8b','#7a7a7a','#9c9c9c','#6d6d6d'];
  const ORE    = ['#8b8b8b','#7a7a7a','#4dd0e1','#26c6da','#9c9c9c'];
  const PLANK  = ['#b0793f','#a06a34','#c08a4c','#8a5a2b'];

  const T = {
    grassTop : tex(GREEN),
    grassSide: tex(DIRT, {top:GREEN}),
    dirt     : tex(DIRT),
    stone    : tex(STONE),
    ore      : tex(ORE),
    plank    : tex(PLANK)
  };

  /* 직육면체 한 개 만들기 */
  function box(w, h, d, opt){
    opt = opt || {};
    const topTex  = opt.top  || T.grassTop;
    const sideTex = opt.side || T.grassSide;
    const botTex  = opt.bottom || T.dirt;
    const el = document.createElement('div');
    el.style.cssText = 'position:absolute;left:0;top:0;transform-style:preserve-3d;';
    if (opt.y) el.style.transform = 'translateY(' + opt.y + 'px)';

    const mk = (bw, bh, bg, tf, shade) => {
      const f = document.createElement('div');
      f.className = 'face';
      f.style.width  = bw + 'px';
      f.style.height = bh + 'px';
      f.style.marginLeft = (-bw/2) + 'px';
      f.style.marginTop  = (-bh/2) + 'px';
      f.style.backgroundImage = 'url(' + bg + ')';
      f.style.backgroundSize = Math.max(2, Math.round(bw/16)*16/bw*100) + '% 100%';
      f.style.backgroundSize = '25% 25%';
      f.style.transform = tf;
      f.style.filter = 'brightness(' + shade + ')';
      el.appendChild(f);
      return f;
    };

    mk(w, d, topTex,  'rotateX(90deg) translateZ(' + (h/2) + 'px)', 1.06);
    mk(w, d, botTex,  'rotateX(-90deg) translateZ(' + (h/2) + 'px)', 0.45);
    mk(w, h, sideTex, 'translateZ(' + (d/2) + 'px)', 0.92);
    mk(w, h, sideTex, 'rotateY(180deg) translateZ(' + (d/2) + 'px)', 0.72);
    mk(d, h, sideTex, 'rotateY(-90deg) translateZ(' + (w/2) + 'px)', 0.80);
    mk(d, h, sideTex, 'rotateY(90deg) translateZ(' + (w/2) + 'px)', 0.64);
    return el;
  }

  /* 떠다니는 섬 (잔디층 + 흙층 + 좁아지는 아랫부분) */
  function island(scale){
    const g = document.createElement('div');
    g.style.cssText = 'position:absolute;left:0;top:0;transform-style:preserve-3d;';
    const W = 200*scale, D = 200*scale;
    g.appendChild(box(W, 26*scale, D, {y:0}));
    g.appendChild(box(W*0.82, 40*scale, D*0.82, {y:32*scale, top:T.dirt, side:T.dirt}));
    g.appendChild(box(W*0.55, 44*scale, D*0.55, {y:72*scale, top:T.dirt, side:T.dirt}));
    g.appendChild(box(W*0.28, 40*scale, D*0.28, {y:112*scale, top:T.stone, side:T.stone}));
    return g;
  }

  /* 단일 블록(광석/판자/돌) */
  function cube(size, kind){
    const t = kind === 'ore' ? T.ore : kind === 'plank' ? T.plank : T.stone;
    return box(size, size, size, {top:t, side:t, bottom:t});
  }

  /* 씬 배치 */
  function place(cfg){
    const scene = document.createElement('div');
    scene.className = 'scene';
    scene.style.left = cfg.x;
    scene.style.top  = cfg.y;
    scene.style.opacity = cfg.opacity || 1;
    if (cfg.blur) scene.style.filter = 'blur(' + cfg.blur + 'px)';

    const bob = document.createElement('div');
    bob.className = 'bob';
    bob.style.animationDuration = cfg.bobDur + 's';
    bob.style.animationDelay = (cfg.delay || 0) + 's';

    const tilt = document.createElement('div');
    tilt.className = 'tilt';
    tilt.style.transform = 'rotateX(' + cfg.tiltX + 'deg) rotateZ(' + (cfg.tiltZ||0) + 'deg)';

    const spin = document.createElement('div');
    spin.className = 'spin';
    spin.style.animationDuration = cfg.spinDur + 's';
    spin.style.animationDirection = cfg.reverse ? 'reverse' : 'normal';
    spin.style.animationDelay = (-(cfg.spinOffset||0)) + 's';

    spin.appendChild(cfg.node);
    tilt.appendChild(spin);
    bob.appendChild(tilt);
    scene.appendChild(bob);
    world.appendChild(scene);
  }

  const small = window.innerWidth < 760;

  /* 큰 섬 2개 (좌/우) */
  place({ node:island(small?0.55:0.95), x:'6%',  y:'26%', tiltX:20, tiltZ:-3,
          spinDur:52, bobDur:5.5, delay:0, opacity:.98 });
  place({ node:island(small?0.42:0.7),  x:'78%', y:'16%', tiltX:24, tiltZ:4,
          spinDur:66, bobDur:6.8, delay:-2, reverse:true, opacity:.95 });

  /* 중앙 뒤쪽 큰 섬 (제목 뒤) */
  place({ node:island(small?0.6:1.15), x:'46%', y:'34%', tiltX:18,
          spinDur:88, bobDur:8, delay:-4, opacity:.55, blur:1 });

  /* 멀리 있는 작은 섬 */
  if (!small){
    place({ node:island(0.32), x:'30%', y:'72%', tiltX:26, spinDur:44, bobDur:4.6, delay:-1, opacity:.6, blur:1.5 });
    place({ node:island(0.28), x:'64%', y:'80%', tiltX:22, spinDur:58, bobDur:5.2, delay:-3, opacity:.5, blur:2, reverse:true });
  }

  /* 떠다니는 블록들 */
  const cubes = small
    ? [['12%','62%',44,'ore',18],['84%','58%',40,'plank',22]]
    : [['20%','14%',52,'ore',16],['70%','66%',60,'plank',21],
       ['88%','40%',46,'stone',26],['13%','78%',48,'ore',19],
       ['52%','12%',38,'plank',24]];
  cubes.forEach((c,i) => {
    place({ node:cube(c[2], c[3]), x:c[0], y:c[1], tiltX:18, tiltZ:8,
            spinDur:c[4], bobDur:3.4 + i*0.6, delay:-i, opacity:.9,
            reverse: i%2===1 });
  });

  /* 픽셀 구름 */
  const nClouds = small ? 4 : 8;
  for (let i=0; i<nClouds; i++){
    const cl = document.createElement('div');
    cl.className = 'cloud';
    cl.style.top = (4 + Math.random()*62) + '%';
    cl.style.left = '0';
    const sc = 1.2 + Math.random()*2.4;
    cl.style.zoom = sc;
    cl.style.opacity = (0.45 + Math.random()*0.45).toFixed(2);
    cl.style.animationDuration = (60 + Math.random()*90) + 's';
    cl.style.animationDelay = (-Math.random()*120) + 's';
    world.appendChild(cl);
  }
})();
</script>
</body>
</html>
